<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amharic Alphabet</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/x-icon" href="../images/favicon_io/favicon-32x32.png">
</head>
<body>
    <header class="site-header">
        <div class="logo-placeholder">
            <img src="../images/new logo.png" alt="Ethiopis Logo" width="150" height="60" loading="lazy">
        </div>
        <nav class="main-nav" aria-label="Main navigation">
            <button id="back-button" data-i18n="nav.back">← Back</button>
            <button id="translate-btn">አማርኛ</button>
        </nav>
    </header>

    <div class="container">
        <header class="page-header">
            <h1 id="main-title">Amharic Alphabet</h1>
            <p id="subtitle">Learn all letters from ሀ to ፖ</p>
        </header>

        <main>
            <div class="mode-selector">
                <button id="by-family">Letter Families</button>
                <button id="by-vowel">Vowel Groups</button>
            </div>
            
            <div class="content-area">
                <h2 id="current-mode">Select learning mode</h2>
                <div class="grid" id="amharic-grid"></div>
            </div>
        </main>
    </div>

    <div class="modal" id="help-modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 id="help-title">How to Use</h3>
            <div id="help-text">
                <p><strong>Letter Families</strong>: Shows all forms of each base letter</p>
                <p><strong>Vowel Groups</strong>: Shows how vowels change letters</p>
                <p>Click any letter to hear pronunciation</p>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <a href="#" id="help-link">Help</a>
        <p data-i18n="footer.copyright">© 2025 Ethiopis. All rights reserved.</p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
