<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Alphabet Learning</title>
    <link rel="stylesheet" href="./styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../images/favicon_io/favicon.ico">
</head>
<body>

    <header class="site-header">
        <div class="logo-placeholder">
            <img src="../images/new logo.png" alt="Ethiopis Logo" width="150" height="60" loading="lazy">
        </div>
        <nav class="main-nav" aria-label="Main navigation">
            <button id="back-button" data-i18n="nav.back">← Back</button>
        </nav>
    </header>

    <div class="container">
        <header class="page-header">
            <h1>English Alphabet</h1>
            <h2>Learn A to Z!</h2>
        </header>

        <main>
            <div class="category">
                <h3>Uppercase Letters</h3>
                <div class="grid" id="uppercase-grid"></div>
            </div>

            <div class="category">
                <h3>Lowercase Letters</h3>
                <div class="grid" id="lowercase-grid"></div>
            </div>
        </main>
    </div>

    <footer class="site-footer">
        <p data-i18n="footer.copyright">© 2025 Ethiopis. All rights reserved.</p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
