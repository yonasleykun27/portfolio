<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Science - Plants</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Noto+Sans+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>
        <h1>Plant Explorer</h1>
        <button id="languageToggle">አማርኛ</button>
    </header>
    
    <main>
        <div class="plant-list" id="plantList"></div>
        <div class="plant-display" id="plantDisplay">
            <p>Click on a plant to learn more!</p>
        </div>
        <div class="growth-animation-container">
            <button id="growBtn">Make It Grow!</button>
            <div class="growth-animation" id="growthAnimation"></div>
        </div>
    </main>

    <audio id="clickSound" src="https://assets.mixkit.co/sfx/preview/mixkit-positive-interface-beep-221.mp3" preload="auto"></audio>
    <script src="./script.js"></script>
</body>
</html>
